<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Light</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    width: 100%;
    height: 100%;
  }
  video {
    display: none;
  }
</style>
</head>
<body>

<video id="video" playsinline></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

<script>
const MAX_HANDS = 6;
const MAX_PARTICLES = 3000;
const showSkeleton = false;
const showCamera = true;
const mirrorMode = true;
const CAMERA_OPACITY = 0.5;
const PARTICLE_LIFE_DECAY = 14;
const PARTICLE_SHRINK = 0.94;

const HAND_COLORS = [
  [80, 200, 255],
  [255, 110, 200],
  [255, 210, 60],
  [120, 255, 140],
  [190, 120, 255],
  [255, 140, 60],
];

const FINGER_TIPS = [4, 8, 12, 16, 20];

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

let latestResults = null;
let videoElement;

function onResults(results) {
  latestResults = results;
}

async function setupHands() {
  videoElement = document.getElementById('video');

  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: MAX_HANDS,
    modelComplexity: 1,
    minDetectionConfidence: 0.4,
    minTrackingConfidence: 0.4
  });

  hands.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await hands.send({ image: videoElement });
    },
    width: 1920,
    height: 1080
  });

  await camera.start();
}

let particles = [];

const sketch = (p) => {
  p.setup = () => {
    const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
    cnv.style('position', 'fixed');
    cnv.style('top', '0');
    cnv.style('left', '0');
    cnv.style('z-index', '1');
    p.pixelDensity(1);
    p.background(0);
  };

  p.windowResized = () => {
    p.resizeCanvas(p.windowWidth, p.windowHeight);
  };

  p.draw = () => {
    p.noStroke();
    p.fill(0, 0, 0, 255);
    p.rect(0, 0, p.width, p.height);
    if (showCamera) {
      drawCameraBackground(p);
    }

    if (latestResults && latestResults.multiHandLandmarks) {
      const handsLm = latestResults.multiHandLandmarks;

      for (let h = 0; h < handsLm.length; h++) {
        const lm = handsLm[h];
        const color = HAND_COLORS[h % HAND_COLORS.length];

        const palm = averagePoint(lm, [0, 5, 9, 13, 17]);
        emitGlow(p, palm, color, 2);

        for (const tipIdx of FINGER_TIPS) {
          emitGlow(p, lm[tipIdx], color, 3);
        }

        if (showSkeleton) {
          drawSkeleton(p, lm, color);
        }
      }
    }

    updateAndDrawParticles(p);
  };
};

function averagePoint(lm, indices) {
  let x = 0, y = 0;
  for (const i of indices) {
    x += lm[i].x;
    y += lm[i].y;
  }
  return { x: x / indices.length, y: y / indices.length };
}

function toScreen(p, point) {
  const x = mirrorMode ? (1 - point.x) * p.width : point.x * p.width;
  const y = point.y * p.height;
  return { x, y };
}

function drawCameraBackground(p) {
  if (!videoElement || videoElement.readyState < 2) return;

  const vw = videoElement.videoWidth;
  const vh = videoElement.videoHeight;
  if (!vw || !vh) return;

  const scale = Math.max(p.width / vw, p.height / vh);
  const dw = vw * scale;
  const dh = vh * scale;
  const dx = (p.width - dw) / 2;
  const dy = (p.height - dh) / 2;

  const ctx = p.drawingContext;
  ctx.save();
  ctx.globalAlpha = CAMERA_OPACITY;
  if (mirrorMode) {
    ctx.translate(p.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(videoElement, dx, dy, dw, dh);
  ctx.restore();
}

function emitGlow(p, point, color, count) {
  const pos = toScreen(p, point);
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) particles.shift();
    particles.push({
      x: pos.x + p.random(-4, 4),
      y: pos.y + p.random(-4, 4),
      vx: p.random(-0.6, 0.6),
      vy: p.random(-1.3, -0.3),
      life: 255,
      size: p.random(6, 22),
      color: color
    });
  }
}

function updateAndDrawParticles(p) {
  p.blendMode(p.ADD);
  p.noStroke();
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy -= 0.01;
    pt.life -= PARTICLE_LIFE_DECAY;
    pt.size *= PARTICLE_SHRINK;

    if (pt.life <= 0 || pt.size < 0.5) {
      particles.splice(i, 1);
      continue;
    }

    const alpha = p.map(pt.life, 0, 255, 0, 180);
    const [r, g, b] = pt.color;

    p.fill(r, g, b, alpha * 0.25);
    p.circle(pt.x, pt.y, pt.size * 2.4);
    p.fill(255, 255, 255, alpha * 0.5);
    p.circle(pt.x, pt.y, pt.size * 0.6);
    p.fill(r, g, b, alpha);
    p.circle(pt.x, pt.y, pt.size);
  }
  p.blendMode(p.BLEND);
}

function drawSkeleton(p, lm, color) {
  p.blendMode(p.ADD);
  p.stroke(color[0], color[1], color[2], 60);
  p.strokeWeight(2);
  for (const [a, b] of HAND_CONNECTIONS) {
    const pa = toScreen(p, lm[a]);
    const pb = toScreen(p, lm[b]);
    p.line(pa.x, pa.y, pb.x, pb.y);
  }
  p.blendMode(p.BLEND);
}

new p5(sketch);
setupHands();
</script>
</body>
</html>
