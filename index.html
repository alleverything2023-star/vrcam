<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Light - 複数人対応 手から光が出るエフェクト</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    width: 100%;
    height: 100%;
  }
  #info {
    position: fixed;
    top: 12px;
    left: 12px;
    color: #fff;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    font-size: 13px;
    background: rgba(0, 0, 0, 0.45);
    padding: 10px 14px;
    border-radius: 10px;
    z-index: 10;
    max-width: 320px;
    line-height: 1.6;
    backdrop-filter: blur(4px);
  }
  #controls {
    position: fixed;
    bottom: 12px;
    left: 12px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  #controls button {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  #controls button:hover {
    background: rgba(255,255,255,0.25);
  }
  video {
    display: none;
  }
</style>
</head>
<body>

<div id="info">
  読み込み中… カメラへのアクセスを許可してください。<br>
  複数人・複数の手を検出し、指先と手のひらから光が出ます。
</div>

<div id="controls">
  <button id="toggleSkeleton">骨格線 ON/OFF</button>
  <button id="clearParticles">光をクリア</button>
</div>

<video id="video" playsinline></video>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<!-- p5.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

<script>
/* =========================================================
   設定
   ========================================================= */
const MAX_HANDS = 6;           // 複数人想定(片手/両手 × 人数)。重ければ減らす
const MAX_PARTICLES = 3000;    // 光の粒子の最大数(パフォーマンス調整用)
let showSkeleton = true;

const HAND_COLORS = [
  [80, 200, 255],   // 水色
  [255, 110, 200],  // ピンク
  [255, 210, 60],   // 黄
  [120, 255, 140],  // 黄緑
  [190, 120, 255],  // 紫
  [255, 140, 60],   // オレンジ
];

const FINGER_TIPS = [4, 8, 12, 16, 20]; // 親指〜小指の先端インデックス

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

/* =========================================================
   MediaPipe Hands セットアップ
   ========================================================= */
let latestResults = null;
let videoElement;

function onResults(results) {
  latestResults = results;
}

async function setupHands() {
  videoElement = document.getElementById('video');

  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: MAX_HANDS,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5
  });

  hands.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await hands.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  try {
    await camera.start();
    document.getElementById('info').innerText =
      'カメラ起動中。手をかざすと光が出ます(複数人対応)。';
  } catch (err) {
    document.getElementById('info').innerText =
      'カメラを起動できませんでした: ' + err.message +
      ' (https 環境 または localhost で開いてください)';
  }
}

/* =========================================================
   p5.js 描画パート
   ========================================================= */
let particles = [];

const sketch = (p) => {
  p.setup = () => {
    const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
    cnv.style('position', 'fixed');
    cnv.style('top', '0');
    cnv.style('left', '0');
    cnv.style('z-index', '1');
    p.pixelDensity(1);
    p.background(0);

    document.getElementById('toggleSkeleton').onclick = () => {
      showSkeleton = !showSkeleton;
    };
    document.getElementById('clearParticles').onclick = () => {
      particles = [];
    };
  };

  p.windowResized = () => {
    p.resizeCanvas(p.windowWidth, p.windowHeight);
  };

  p.draw = () => {
    // 残像(トレイル)効果。値を小さくするほど尾を長く引く
    p.noStroke();
    p.fill(0, 0, 0, 40);
    p.rect(0, 0, p.width, p.height);

    if (latestResults && latestResults.multiHandLandmarks) {
      const handsLm = latestResults.multiHandLandmarks;

      for (let h = 0; h < handsLm.length; h++) {
        const lm = handsLm[h];
        const color = HAND_COLORS[h % HAND_COLORS.length];

        // 手のひら中心付近から光を放出
        const palm = averagePoint(lm, [0, 5, 9, 13, 17]);
        emitGlow(p, palm, color, 2);

        // 各指先から光の粒子を放出
        for (const tipIdx of FINGER_TIPS) {
          emitGlow(p, lm[tipIdx], color, 3);
        }

        if (showSkeleton) {
          drawSkeleton(p, lm, color);
        }
      }
    }

    updateAndDrawParticles(p);
  };
};

function averagePoint(lm, indices) {
  let x = 0, y = 0;
  for (const i of indices) {
    x += lm[i].x;
    y += lm[i].y;
  }
  return { x: x / indices.length, y: y / indices.length };
}

function toScreen(p, point) {
  // 前面カメラ映像はミラー表示にする(左右反転)
  const x = (1 - point.x) * p.width;
  const y = point.y * p.height;
  return { x, y };
}

function emitGlow(p, point, color, count) {
  const pos = toScreen(p, point);
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) particles.shift();
    particles.push({
      x: pos.x + p.random(-4, 4),
      y: pos.y + p.random(-4, 4),
      vx: p.random(-0.6, 0.6),
      vy: p.random(-1.3, -0.3),
      life: 255,
      size: p.random(6, 22),
      color: color
    });
  }
}

function updateAndDrawParticles(p) {
  p.blendMode(p.ADD);
  p.noStroke();
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy -= 0.01; // ふわっと上昇する感じ
    pt.life -= 6;
    pt.size *= 0.985;

    if (pt.life <= 0 || pt.size < 0.5) {
      particles.splice(i, 1);
      continue;
    }

    const alpha = p.map(pt.life, 0, 255, 0, 180);
    const [r, g, b] = pt.color;

    // 外側の柔らかいグロー
    p.fill(r, g, b, alpha * 0.25);
    p.circle(pt.x, pt.y, pt.size * 2.4);
    // 内側の明るいコア(白っぽく)
    p.fill(255, 255, 255, alpha * 0.5);
    p.circle(pt.x, pt.y, pt.size * 0.6);
    p.fill(r, g, b, alpha);
    p.circle(pt.x, pt.y, pt.size);
  }
  p.blendMode(p.BLEND);
}

function drawSkeleton(p, lm, color) {
  p.blendMode(p.ADD);
  p.stroke(color[0], color[1], color[2], 60);
  p.strokeWeight(2);
  for (const [a, b] of HAND_CONNECTIONS) {
    const pa = toScreen(p, lm[a]);
    const pb = toScreen(p, lm[b]);
    p.line(pa.x, pa.y, pb.x, pb.y);
  }
  p.blendMode(p.BLEND);
}

new p5(sketch);
setupHands();
</script>
</body>
</html>
